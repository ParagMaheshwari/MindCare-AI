<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Result — MindCare AI</title>
<link rel="stylesheet" href="css/style.css?v=2.5" />
<script>
  (function() {
    const t = localStorage.getItem("mindcare_theme") || "dark";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body data-page="results">

<div id="app-shell-mount"></div>

<div id="page-content" class="page-content-wrap" style="max-width: 1180px; margin: 0 auto; padding: 24px 20px 80px;">
  <div class="page-head">
    <h1>Your Wellness Result</h1>
    <p>Generated by the MindCare AI machine-learning model from your submitted answers.</p>
  </div>

  <div id="mc-result-content">
    <div class="card-elevated section-gap" style="padding:48px 24px; text-align:center; max-width:640px; margin:40px auto;">
      <div class="spinner-sm" style="width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--moss-dark); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 16px;"></div>
      <h3 style="font-size:1.15rem; color:var(--ink); margin-bottom:6px;">Loading your wellness report...</h3>
      <p style="color:var(--ink-soft); font-size:0.88rem;">Retrieving your personalized mental health assessment and machine-learning predictions.</p>
    </div>
  </div>
</div>

<script src="js/auth.js?v=2.5"></script>
<script src="js/storage.js?v=2.5"></script>
<script src="js/theme.js?v=2.5"></script>
<script src="js/config.js"></script>
<script src="js/api.js?v=2.5"></script>
<script src="js/results.js?v=2.5"></script>
<script src="js/app-shell.js?v=2.5"></script>
<script src="js/chatbot.js?v=2.5"></script>
<script src="js/result-page.js?v=2.5"></script>
</body>
</html>
