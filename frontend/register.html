<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account — MindCare AI</title>
<link rel="stylesheet" href="css/style.css" />
<script>
  (function() {
    const t = localStorage.getItem("mindcare_theme") || "dark";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body>

<div class="auth-shell">
  <header class="auth-header" role="banner">
    <div class="auth-header-inner">
      <div class="auth-header-spacer" aria-hidden="true"></div>
      <a href="index.html" class="brand auth-brand" aria-label="MindCare AI Home">
        <span class="mark">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20c9 0 14-5 14-14 0 0-13-2-14 9-.4 3 0 5 0 5Z"/><path d="M5 20c0-6 3-9 8-11"/></svg>
        </span>
        <span class="brand-text">MindCare AI</span>
      </a>
      <button type="button" class="theme-toggle-btn auth-theme-toggle" title="Toggle Theme" aria-label="Toggle Theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card card-elevated">
      <h1>Create your account</h1>
      <p class="sub">Start understanding your mental wellness in a few minutes.</p>

      <div class="form-error-banner" id="mc-register-error"></div>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required minlength="2" placeholder="Jordan Lee" />
          <div class="error-text">Enter your full name.</div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com" />
          <div class="error-text">Enter a valid email address.</div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-field">
            <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters" />
            <button type="button" class="password-toggle" data-target="password" aria-label="Show password"></button>
          </div>
          <div class="password-strength" id="mc-strength-bars">
            <span></span><span></span><span></span><span></span>
          </div>
          <div class="hint" id="mc-strength-label">Use 8+ characters with a mix of letters and numbers.</div>
        </div>

        <div class="field">
          <label for="confirm_password">Confirm Password</label>
          <div class="password-field">
            <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password" placeholder="Re-enter your password" />
            <button type="button" class="password-toggle" data-target="confirm_password" aria-label="Show password"></button>
          </div>
          <div class="error-text" id="mc-confirm-error">Passwords do not match.</div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="register-submit">Create Account</button>
      </form>

      <div class="auth-switch">
        Already have an account? <a href="login.html">Log In</a>
      </div>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/api.js?v=3.0"></script>
<script src="js/auth.js?v=3.0"></script>
<script src="js/theme.js"></script>
<script>
  const EYE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
  const EYE_OFF = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a15.4 15.4 0 0 1-3.2 4.1M6.2 6.2C3.6 8 2 12 2 12s3.5 7 10 7a10 10 0 0 0 4.1-.9"/><path d="M9.5 9.5a3 3 0 0 0 4.2 4.2"/></svg>`;

  document.querySelectorAll(".password-toggle").forEach((btn) => {
    const input = document.getElementById(btn.dataset.target);
    btn.innerHTML = EYE;
    btn.addEventListener("click", () => {
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      btn.innerHTML = show ? EYE_OFF : EYE;
    });
  });

  // Password strength indicator
  const passwordInput = document.getElementById("password");
  const bars = document.querySelectorAll("#mc-strength-bars span");
  const strengthLabel = document.getElementById("mc-strength-label");
  const strengthColors = ["#B4644F", "#C68A3B", "#6E7FB3", "#3F7D5C"];
  const strengthLabels = ["Weak", "Fair", "Good", "Strong"];

  function scorePassword(pw) {
    let score = 0;
    if (pw.length >= 8) score++;
    if (pw.length >= 12) score++;
    if (/[0-9]/.test(pw) && /[a-zA-Z]/.test(pw)) score++;
    if (/[^a-zA-Z0-9]/.test(pw)) score++;
    return Math.max(0, Math.min(4, score));
  }

  passwordInput.addEventListener("input", () => {
    const score = scorePassword(passwordInput.value);
    bars.forEach((bar, i) => {
      bar.style.background = i < score ? strengthColors[Math.max(0, score - 1)] : "";
    });
    strengthLabel.textContent = passwordInput.value
      ? `Password strength: ${strengthLabels[Math.max(0, score - 1)]}`
      : "Use 8+ characters with a mix of letters and numbers.";
  });

  // Validation + submit
  const form = document.getElementById("register-form");
  const errorBanner = document.getElementById("mc-register-error");
  const submitBtn = document.getElementById("register-submit");
  const confirmField = document.getElementById("confirm_password").closest(".field");

  if (MindCareAuth.getCurrentUser()) {
    window.location.href = "dashboard.html";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBanner.classList.remove("visible");
    confirmField.classList.remove("has-error");

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirm_password").value;

    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }

    if (password !== confirmPassword) {
      confirmField.classList.add("has-error");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Creating account…";

    try {
      await MindCareAuth.registerUser({ name, email, password });
      window.location.href = "dashboard.html";
    } catch (err) {
      errorBanner.textContent = err.friendlyMessage || "Something went wrong. Please try again.";
      errorBanner.classList.add("visible");
      submitBtn.disabled = false;
      submitBtn.textContent = "Create Account";
    }
  });
</script>

</body>
</html>
